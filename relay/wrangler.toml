name = "riplox-relay"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# Without this, nothing about a live request is recorded anywhere, and the only
# way to learn the relay is refusing everybody is for somebody to say so.
# Included on the free plan: 200,000 events a day, kept for three days - far
# more than a postbox this size produces.
[observability]
enabled = true

# The pairing URL is printed into a QR code and shipped as the app's default,
# so it has to be a brand address. The generated workers.dev subdomain carries
# the account owner's email in it, which is not something to hand to every
# user of a public app.
[[routes]]
pattern = "relay.xniperbuilds.com"
custom_domain = true

# One Durable Object per pairing. It holds the queue and pushes to whoever is
# listening - a hibernatable WebSocket from the PC, or one the Worker holds on
# the PC's behalf when its network will not pass a WebSocket upgrade. Nothing
# is ever held open inside the object itself: it cannot hibernate while a
# request is in flight, and it is billed for wall-clock time whenever it cannot
# hibernate. Workers KV could not do this at all, and its free tier caps writes
# at 1,000 a day, which a postbox would burn through.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed, which is the class the free plan allows.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
